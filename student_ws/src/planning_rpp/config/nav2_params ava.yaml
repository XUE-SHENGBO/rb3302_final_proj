amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    #alpha1: 0.4
    #alpha2: 0.4
    #alpha3: 0.4
    #alpha4: 0.4
    #alpha5: 0.4

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.05
    update_min_a: 0.05

    #alpha1: 0.8
    #alpha2: 0.8
    #alpha3: 0.8
    #alpha4: 0.8
    #alpha5: 0.8

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      yaw_goal_tolerance: 3.14
      xy_goal_tolerance: 0.05
      stateful: false
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      #desired_linear_vel: 0.2
      #lookahead_dist: 0.25
      #min_lookahead_dist: 0.15
      #max_lookahead_dist: 0.35

      desired_linear_vel: 0.2
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.4      

      #desired_linear_vel: 0.2
      #lookahead_dist: 0.3
      #min_lookahead_dist: 0.2
      #max_lookahead_dist: 0.4

      allow_reversing: true
      use_rotate_to_heading: false
      max_allowed_time_to_collision_up_to_carrot: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      #robot size/dimensions
      footprint: "[[-0.10, -0.09], [0.10, -0.09], [0.10, 0.09], [-0.10, 0.09]]"
      #footprint: "[[-0.025, -0.025], [0.025, -0.025], [0.025, 0.025], [-0.025, 0.025]]"
      #footprint: "[[-0.16, -0.165], [0.16, -0.165], [0.16, 0.165], [-0.16, 0.165]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3    #inflation_radius: 0.55
        #cost_scaling_factor: 2.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      #robot size/dimensions
      #footprint: "[[-0.025, -0.025], [0.025, -0.025], [0.025, 0.025], [-0.025, 0.025]]"
      #2footprint: "[[-0.16, -0.165], [0.16, -0.165], [0.16, 0.165], [-0.16, 0.165]]"
      footprint: "[[-0.10, -0.09], [0.10, -0.09], [0.10, 0.09], [-0.10, 0.09]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.4     #inflation_radius: 0.55
        #cost_scaling_factor: 2.0
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP

    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]

    #controls the velocty and accelration limits of the robot. The first value is the linear velocity in m/s, the second value is the angular velocity in rad/s, and the third value is the linear acceleration in m/s^2. The min_velocity and max_decel values are negative to indicate that they are deceleration limits.
    #max_velocity: [0.5, 0.0, 1.0]
    #min_velocity: [-0.5, 0.0, -1.0]
    #max_accel: [0.5, 0.0, 0.5]
    #max_decel: [-0.5, 0.0, -0.5]
    
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoints